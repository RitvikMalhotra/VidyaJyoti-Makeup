<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120D0B" />

    <title>Vidya Jyoti — Bridal Makeup Artist in Kondapur, Hyderabad</title>
    <meta
      name="description"
      content="Bridal, engagement, party and editorial makeup in Kondapur, Hyderabad. Skin consultation first, a trial before the day, and a base built to last from the morning ceremony to the last photograph. 4.9★ from 55 Google reviews."
    />

    <!-- TODO — set the real domain once it is registered, then uncomment.
    <link rel="canonical" href="https://vidyajyoti.example/" />
    <meta property="og:url" content="https://vidyajyoti.example/" />
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vidya Jyoti Makeup Artistry" />
    <meta property="og:title" content="Vidya Jyoti — Bridal Makeup Artist in Hyderabad" />
    <meta
      property="og:description"
      content="Enhancing natural beauty, revealing the inner radiance. Bridal makeup in Kondapur, Hyderabad — 4.9★ from 55 Google reviews."
    />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Italiana&family=Jost:wght@200;300;400&display=swap"
      rel="stylesheet"
    />

    <!-- The hero is the LCP element. Warming its smallest variant here means
         the phone-sized file is in flight before the bundle has parsed. -->
    <link
      rel="preload"
      as="image"
      href="/photos/hero-800.webp"
      imagesrcset="/photos/hero-800.webp 800w, /photos/hero-1400.webp 1400w, /photos/hero-2000.webp 2000w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!--
      Structured data.

      Every value matches what is visible on the page and what is on the real
      Google Business listing. Google penalises structured data that does not,
      and an inflated rating is a fabricated business record.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Vidya Jyoti Makeup Artistry",
        "alternateName": "Vidya Jyoti",
        "description": "Bridal, engagement, reception, party and editorial makeup artistry in Kondapur, Hyderabad. Skin consultation, makeup, hairstyling and saree draping.",
        "telephone": "+91-77319-52859",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "My Home Mangala Rd, Shilpa Valley",
          "addressLocality": "Kondapur, Serilingampalle (M)",
          "addressRegion": "Telangana",
          "postalCode": "500084",
          "addressCountry": "IN"
        },
        "areaServed": "Hyderabad, Telangana, IN",
        "sameAs": ["https://www.instagram.com/vidyajyoti_makeup"],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "reviewCount": "55",
          "bestRating": "5"
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bridal makeup" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Engagement, cocktail and reception makeup" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Party makeup" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Editorial and model makeup" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
